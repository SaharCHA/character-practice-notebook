<!doctype html>
<html lang="uk" data-scheme="zoshyt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зошит ієрогліфів</title>
<meta name="description" content="Тренажер китайських ієрогліфів: письмо за рисками, картки, вікторина, пари.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c8321e'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23fff' font-family='Kaiti SC,KaiTi,STKaiti,serif'%3E字%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root {
  --ts: 1; --tile: 68px; --field: 360px;
  --f-head: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-text: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-pin: "Noto Sans", "Golos Text", system-ui, sans-serif;
  --f-han: "Kaiti SC", "KaiTi", "STKaiti", "AR PL UKai CN", "Noto Serif SC", "Songti SC", serif;
  --seal: #c8321e; --on-seal: #fff6ee;
  --r: 10px;
}
/* ---- схеми: «Зошит», «Туш», «Нефрит», «Слива», «Контраст» ---- */
[data-scheme="zoshyt"][data-theme="light"] {
  --bg: #f5f8ee; --rule: #cfe3c6; --paper: #fffffb; --paper2: #eef4e6; --ink: #1c2f78; --mute: #5a6790;
  --line: #b7cdb0; --accent: #1f3fa6; --on-accent: #ffffff; --glyph: #1b2c7c; --outline: #cdd6ea;
  --hl: #e0612a; --rad: #1e8a4c; --draw: #3552c4; --grid: #9fc79a; --ok: #1e7d46; --mid: #a86a00; --bad: #c0281c;
}
[data-scheme="zoshyt"][data-theme="dark"] {
  --bg: #1d382e; --rule: #2a4a3d; --paper: #244438; --paper2: #1a3229; --ink: #f1f3e6; --mute: #b5c7b6;
  --line: #4a6b5b; --accent: #f3dc7a; --on-accent: #1d2c20; --glyph: #f6f5ea; --outline: #4d6e5f;
  --hl: #ffb86b; --rad: #8fe3ff; --draw: #fffbe0; --grid: #5d8270; --ok: #9fe6a6; --mid: #f3d27a; --bad: #ff9c8c;
  --seal: #e2533c;
}
[data-scheme="tush"][data-theme="light"] {
  --bg: #f3eee2; --rule: #e6dfcf; --paper: #fbf8f0; --paper2: #ece5d5; --ink: #1d1a16; --mute: #6b6457;
  --line: #cbc1ab; --accent: #26221c; --on-accent: #fbf8f0; --glyph: #16130f; --outline: #d9d1bf;
  --hl: #c8321e; --rad: #a3421a; --draw: #3a342b; --grid: #c9b99a; --ok: #2f6b3c; --mid: #8f5f00; --bad: #b3261a;
}
[data-scheme="tush"][data-theme="dark"] {
  --bg: #151412; --rule: #1f1d1a; --paper: #211f1c; --paper2: #191715; --ink: #ece5d6; --mute: #a59c8b;
  --line: #45413a; --accent: #ece5d6; --on-accent: #191715; --glyph: #f2ecdf; --outline: #47423a;
  --hl: #ff7a5c; --rad: #e9b872; --draw: #ffffff; --grid: #5a5347; --ok: #93d6a0; --mid: #e8c06a; --bad: #ff8f7d;
  --seal: #d9442e;
}
[data-scheme="jade"][data-theme="light"] {
  --bg: #ecf5f0; --rule: #d3e8dd; --paper: #fbfefc; --paper2: #e1f0e8; --ink: #113b32; --mute: #4f7268;
  --line: #a9cfbe; --accent: #17755a; --on-accent: #ffffff; --glyph: #0f4638; --outline: #c8e0d6;
  --hl: #d2691e; --rad: #7a3fb0; --draw: #1b8c6c; --grid: #93c7b2; --ok: #17755a; --mid: #946200; --bad: #b8301f;
}
[data-scheme="jade"][data-theme="dark"] {
  --bg: #0e231f; --rule: #15302a; --paper: #153029; --paper2: #0c1e1a; --ink: #dbf0e6; --mute: #94b9ab;
  --line: #2e5a4d; --accent: #62cfa6; --on-accent: #062019; --glyph: #e3f6ed; --outline: #315a4e;
  --hl: #ffb26b; --rad: #d8a6ff; --draw: #a4f0d1; --grid: #3f7362; --ok: #7fe0b3; --mid: #efca70; --bad: #ff9a8a;
  --seal: #e2533c;
}
[data-scheme="plum"][data-theme="light"] {
  --bg: #f7eff4; --rule: #ecdbe6; --paper: #fffbfd; --paper2: #f1e2ec; --ink: #3b1d38; --mute: #7a5874;
  --line: #d6b8cd; --accent: #8a2c6a; --on-accent: #ffffff; --glyph: #45163f; --outline: #e3cfdd;
  --hl: #d9541e; --rad: #1f7a6a; --draw: #a3387f; --grid: #d0a5c3; --ok: #2c7548; --mid: #8f5c00; --bad: #b8261f;
}
[data-scheme="plum"][data-theme="dark"] {
  --bg: #211220; --rule: #2c1a2a; --paper: #2e1a2c; --paper2: #1a0e19; --ink: #f2deed; --mute: #c09fb9;
  --line: #5a3a55; --accent: #e594c9; --on-accent: #2a0f25; --glyph: #f8e6f3; --outline: #593a54;
  --hl: #ffb070; --rad: #8fe6d2; --draw: #ffd0ef; --grid: #6f4a68; --ok: #9be0b0; --mid: #f0c873; --bad: #ff9c94;
  --seal: #e2533c;
}
[data-scheme="contrast"][data-theme="light"] {
  --bg: #ffffff; --rule: #ffffff; --paper: #ffffff; --paper2: #f0f0f0; --ink: #000000; --mute: #333333;
  --line: #000000; --accent: #0030c0; --on-accent: #ffffff; --glyph: #000000; --outline: #b8b8b8;
  --hl: #d00000; --rad: #007a2a; --draw: #0030c0; --grid: #808080; --ok: #006b24; --mid: #7a4a00; --bad: #c00000;
  --seal: #c00000; --on-seal: #ffffff;
}
[data-scheme="contrast"][data-theme="dark"] {
  --bg: #000000; --rule: #000000; --paper: #000000; --paper2: #1a1a1a; --ink: #ffffff; --mute: #d6d6d6;
  --line: #ffffff; --accent: #ffe600; --on-accent: #000000; --glyph: #ffffff; --outline: #5c5c5c;
  --hl: #ff7070; --rad: #6dff9a; --draw: #ffe600; --grid: #8c8c8c; --ok: #6dff9a; --mid: #ffd24d; --bad: #ff7b7b;
  --seal: #ff4433; --on-seal: #000000;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: calc(100% * var(--ts)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--f-text); line-height: 1.45;
  background: var(--bg) repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  overflow-wrap: anywhere; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--f-head); font-weight: 700; line-height: 1.2; margin: 0; }
h2 { font-size: 1.05rem; }
h3 { font-size: .8rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); margin-bottom: .5rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }
.han { font-family: var(--f-han); }
.pin { font-family: var(--f-pin); }
.mute { color: var(--mute); }

/* ---- шапка ---- */
header.top { background: var(--paper); border-bottom: 2px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
.seal {
  flex: none; width: 2.6rem; height: 2.6rem; border-radius: 8px; background: var(--seal); color: var(--on-seal);
  display: grid; place-items: center; font-family: var(--f-han); font-size: 1.9rem; line-height: 1;
  transform: rotate(-4deg); box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 3.5px color-mix(in srgb, var(--on-seal) 70%, transparent);
}
.brand h1 { font-size: 1.15rem; flex: 1; min-width: 0; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 0; }
nav.tabs a {
  padding: .5rem .7rem; text-decoration: none; color: var(--mute); font-weight: 600; font-size: .92rem;
  border: 2px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; margin-bottom: -2px;
}
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--bg); border-color: var(--line); }
main { padding-top: 20px; padding-bottom: 40px; flex: 1; width: 100%; }

/* ---- кнопки та поля ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 2.5rem; padding: .45rem .9rem;
  border: 1.5px solid var(--line); border-radius: var(--r); background: var(--paper); color: var(--ink);
  font-weight: 500; cursor: pointer; text-align: center;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.btn.sm { min-height: 2.1rem; padding: .25rem .65rem; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
input[type="text"], select, textarea {
  width: 100%; min-height: 2.5rem; padding: .45rem .65rem; border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--paper2); color: var(--ink);
}
textarea { min-height: 6.5rem; resize: vertical; font-family: var(--f-han), var(--f-text); font-size: 1.1rem; display: block; }
label.fld { display: block; font-weight: 600; margin-bottom: .35rem; }
label.ck { display: inline-flex; align-items: center; gap: .5em; cursor: pointer; min-height: 2rem; }
input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); flex: none; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--paper2); }
.seg button { border: 0; background: none; padding: .4rem .75rem; min-height: 2.3rem; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button:focus-visible { outline-offset: -3px; }
.msg { margin-top: .6rem; font-weight: 500; }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--mute); }
.badge { display: inline-block; font: 500 .72rem var(--f-text); padding: .1rem .5rem; border-radius: 99px; background: var(--seal); color: var(--on-seal); vertical-align: middle; letter-spacing: 0; text-transform: none; }
#net { position: sticky; top: 0; z-index: 5; background: var(--bad); color: var(--paper); padding: 8px 0; }
#net .wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

/* ---- знак ---- */
svg.gl { display: block; width: 100%; height: 100%; fill: currentColor; color: var(--glyph); }
.gl-t { display: grid; place-items: center; width: 100%; height: 100%; font-family: var(--f-han); color: var(--glyph); line-height: 1; container-type: size; }
.gl-t > b { font-weight: 400; font-size: 78cqmin; }

/* ---- список ---- */
.setbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 720px) { .setbar { grid-template-columns: minmax(0, 320px) 1fr; align-items: end; } }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 100%; padding: 10px;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; text-align: center;
}
.tile:hover { border-color: var(--accent); }
.cells { display: flex; flex-wrap: wrap; justify-content: center; }
.cell {
  width: var(--tile); height: var(--tile); flex: none; border: 1.5px solid var(--grid); margin-left: -1.5px; padding: 6%;
  background:
    linear-gradient(to right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--grid) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    var(--paper);
}
.cell:first-child { margin-left: 0; }
.tile .tp { font-family: var(--f-pin); font-size: .9rem; color: var(--accent); max-width: calc(var(--tile) * 2.4); }
.tile .tm { font-size: .82rem; color: var(--mute); max-width: max(calc(var(--tile) * 2.4), 100%); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bars { display: flex; gap: 3px; margin-top: 2px; }
.bars i { width: 12px; height: 4px; border-radius: 2px; background: var(--line); }
.bars i.on { background: var(--ok); }
body.no-p .tile .tp, body.no-m .tile .tm, body.no-b .tile .bars { display: none; }
details.help { margin-top: .75rem; color: var(--mute); font-size: .9rem; }
details.help summary { cursor: pointer; }
details.help pre { font-family: var(--f-han), var(--f-pin); margin: .5rem 0 0; white-space: pre-wrap; font-size: 1rem; color: var(--ink); }

/* ---- письмо ---- */
.wopts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.wopts select { width: auto; }
.wmain { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wprompt { text-align: center; min-height: 3.2rem; }
.wprompt .pin { font-size: 1.5rem; color: var(--accent); }
.wprompt .mean { font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { width: 2.2rem; height: 2.2rem; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-han); font-size: 1.3rem; background: var(--paper); color: var(--mute); }
.chip.hid { color: transparent; }
.chip.cur { border-color: var(--accent); border-width: 2.5px; }
.chip.done { background: var(--ok); border-color: var(--ok); color: var(--paper); }
button.chip { cursor: pointer; color: var(--ink); }
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fieldwrap { position: relative; width: min(var(--field), 100%); aspect-ratio: 1; background: var(--paper); border: 2.5px solid var(--grid); border-radius: 6px; }
.fieldwrap svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fieldwrap svg.grid path { stroke: var(--grid); stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; vector-effect: non-scaling-stroke; }
#field { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
#field svg { display: block; }
.stamp {
  position: absolute; top: 4%; right: 4%; width: 26%; aspect-ratio: 1; border-radius: 14%; display: grid; place-items: center;
  font-family: var(--f-han); font-size: calc(min(var(--field), 100vw - 32px) * .19); line-height: 1; pointer-events: none;
  color: var(--seal); border: .09em solid var(--seal); background: color-mix(in srgb, var(--paper) 82%, transparent);
  transform: rotate(8deg); animation: stamp .28s cubic-bezier(.2, 1.6, .4, 1);
}
.stamp.g-ok { color: var(--mid); border-color: var(--mid); }
.stamp.g-again { color: var(--mute); border-color: var(--mute); }
@keyframes stamp { from { transform: rotate(8deg) scale(1.9); opacity: 0; } }
.wstat { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; color: var(--mute); font-size: .95rem; }
.wbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.results { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
.results li { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: var(--paper2); border-radius: 8px; }
.results .han { font-size: 1.5rem; min-width: 2.2em; }
.results .g { font-family: var(--f-han); font-size: 1.3rem; color: var(--seal); width: 1.6em; height: 1.6em; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 5px; flex: none; }
.results .g.g-ok { color: var(--mid); } .results .g.g-again, .results .g.g-none { color: var(--mute); }
.results .rm { flex: 1; min-width: 0; color: var(--mute); font-size: .9rem; }

/* ---- картки ---- */
.center { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.fc {
  width: min(420px, 100%); min-height: 260px; padding: 20px; border: 2px solid var(--line); border-radius: 18px; background: var(--paper);
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  transition: transform .18s;
}
.fc.back { border-color: var(--accent); background: var(--paper2); }
.fc .big { display: flex; flex-wrap: wrap; justify-content: center; }
.fc .big > span { width: 110px; height: 110px; }
.fc .pin { font-size: 1.4rem; color: var(--accent); }
.fc .mean { font-size: 1.25rem; }
.fc .tap { font-size: .85rem; color: var(--mute); }

/* ---- вікторина ---- */
.qprompt { min-height: 130px; display: grid; place-items: center; text-align: center; }
.qprompt .big { display: flex; flex-wrap: wrap; justify-content: center; }
.qprompt .big > span { width: 110px; height: 110px; }
.qprompt .txt { font-size: 1.5rem; font-weight: 500; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(560px, 100%); }
.qopt { min-height: 4.6rem; padding: 8px 10px 8px 2rem; position: relative; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer; display: grid; place-items: center; font-size: 1.05rem; }
.qopt kbd { position: absolute; left: 8px; top: 6px; font: 500 .75rem var(--f-pin); color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 0 .35em; }
.qopt .big { display: flex; flex-wrap: wrap; justify-content: center; }
.qopt .big > span { width: 54px; height: 54px; }
.qopt:hover:not(:disabled) { border-color: var(--accent); }
.qopt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--paper)); }
.qopt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--paper)); }
.qopt:disabled { cursor: default; }
.score { font-family: var(--f-head); font-size: 2rem; }

/* ---- пари ---- */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(640px, 100%); }
@media (min-width: 700px) { .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pc { min-height: 92px; padding: 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer; display: grid; place-items: center; text-align: center; font-size: .95rem; }
.pc .big { display: flex; flex-wrap: wrap; justify-content: center; }
.pc .big > span { width: 46px; height: 46px; }
.pc[aria-pressed="true"] { border-color: var(--accent); border-width: 3px; background: var(--paper2); }
.pc.matched { opacity: .35; border-style: dashed; cursor: default; }
.pc.bad { border-color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---- діалоги ---- */
dialog {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 2px solid var(--line); border-radius: 16px;
  background: var(--paper); color: var(--ink); overflow: auto;
}
dialog::backdrop { background: rgb(0 0 0 / .5); }
.dhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1.5px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 1; }
.dhead h2 { flex: 1; min-width: 0; }
.dbody { padding: 16px; display: grid; gap: 16px; }
.eanim { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ebox { width: 180px; height: 180px; position: relative; border: 2px solid var(--grid); border-radius: 6px; background: var(--paper); }
.ebox svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; }
.ebox svg.grid path { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 5 5; fill: none; vector-effect: non-scaling-stroke; }
#eField { position: absolute; inset: 0; }
#eField .gl-t { position: absolute; inset: 0; }
.efields { display: grid; gap: 10px; }
dl.info { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.info dt { color: var(--mute); font-size: .9rem; }
dl.info dd { margin: 0; }
dl.info dd .han { font-size: 1.25rem; }
.sgrid { display: grid; gap: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }

const TONE = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜńňǹ]|[a-zü][1-5](?![a-z])/i;
const LATIN_WORD = /^[a-zāáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜńňǹ1-5'’.,:-]+$/i;
const CYR = /[Ѐ-ӿ]/;
function parseInput(text, split) {
  const out = [];
  const push = (h, p, m) => {
    if (split && [...h].length > 1) { for (const c of h) out.push({ h: c, p: '', m: '' }); } else out.push({ h, p: p || '', m: m || '' });
  };
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const runs = line.match(HAN_RUN);
    if (!runs) continue;
    if (/^[\p{Script=Han}\p{P}\p{Z}\t|]+$/u.test(line)) { runs.forEach((h) => push(h)); continue; }
    const h = runs[0];
    const rest = line.slice(line.indexOf(h) + h.length).replace(/^[\s:：=,，|;；—–-]+/, '').trim();
    const parts = rest.split(/\t+|\s+[—–-]\s+|\s*\|\s*|\s*[;；]\s*/).map((s) => s.trim()).filter(Boolean);
    let p = '', m = '';
    if (parts.length >= 2) {
      if (parts[0].split(/\s+/).every((w) => LATIN_WORD.test(w))) { p = parts[0]; m = parts.slice(1).join('; '); }
      else m = parts.join('; ');
    } else if (parts.length === 1) {
      const words = parts[0].split(/\s+/);
      let n = 0;
      while (n < words.length && LATIN_WORD.test(words[n])) n++;
      const tail = words.slice(n).join(' ');
      if (n && CYR.test(tail)) { p = words.slice(0, n).join(' '); m = tail; }
      else {
        let k = 0;
        while (k < n && TONE.test(words[k])) k++;
        p = words.slice(0, k).join(' '); m = words.slice(k).join(' ');
      }
    }
    push(h, p.replace(/[.,:]+$/, ''), m);
  }
  return out;
}
function autofill(items) {
  let changed = false;
  for (const it of items) {
    const chars = hanOf(it.h);
    if (!it.p) {
      const ps = chars.map((c) => DB[c] && DB[c].p && DB[c].p[0]).filter(Boolean);
      if (ps.length) { it.p = ps.join(' '); it.ap = true; changed = true; }
    }
    if (!it.m && chars.length === 1 && DB[chars[0]] && DB[chars[0]].d) {
      it.m = DB[chars[0]].d.split(/[;,]/).map((s) => s.trim()).filter(Boolean).slice(0, 2).join(', ');
      if (it.m) { it.a = true; changed = true; }
    }
  }
  return changed;
}
function addEntries(text, split) {
  const parsed = parseInput(text, split);
  if (!parsed.length) return { n: 0, m: 0, none: true };
  let set = curSet(), created = null;
  if (set.demo) {
    set = { id: uid(), name: t('mySet'), items: [] };
    S.sets.push(set); S.cur = set.id; created = set.name;
  }
  const have = new Set(set.items.map((it) => it.h));
  const fresh = [];
  let dup = 0;
  for (const e of parsed) {
    if (have.has(e.h)) { dup++; continue; }
    have.add(e.h);
    const it = { h: e.h, p: e.p, m: e.m };
    set.items.push(it); fresh.push(it);
  }
  save();
  const fill = () => { if (autofill(fresh)) { save(); if (R === 'list') renderTiles(); } };
  if (ensure(fresh.flatMap((it) => hanOf(it.h)), fill)) fill();
  return { n: fresh.length, m: dup, created };
}

/* =================== пари =================== */
let P = null;
const fmtTime = (ms) => (ms / 1000).toFixed(1) + ' ' + t('sec');

  stopPairsTimer();

    const m = norm(set.items[i].m);
    if (!m || seen.has(m)) continue;
    seen.add(m); pick.push(i);

  }
  const cards = shuffle(pick.flatMap((i) => [{ i, kind: 'h' }, { i, kind: 'm' }]));

  const set = curSet();
  if (!P || P.sig !== sig(set)) newPairs(set);
  if (P.n < 2) { view().innerHTML = emptyHTML('pNeed'); return; }
  ensure(P.cards.filter((c) => c.kind === 'h').flatMap((c) => hanOf(set.items[c.i].h)), renderPairs);
  const best = S.best[P.setId + ':' + P.n];
  view().innerHTML = '<section class="center">' +
    '<p class="mute">' + esc(t('pHint')) + '</p>' +
    '<div class="wstat"><span id="pTime">' + esc(t('pTime', { t: fmtTime(P.elapsed) })) + '</span><span id="pTries">' + esc(t('pTries', { n: P.tries })) + '</span>' +
      (best ? '<span id="pBest">' + esc(t('pBest', { t: fmtTime(best) })) + '</span>' : '') + '</div>' +
    '<div class="pgrid" id="pGrid">' + P.cards.map((c, id) => {
      const it = set.items[c.i], matched = P.matched.has(c.i);
      return '<button class="pc' + (matched ? ' matched' : '') + (P.bad.includes(id) ? ' bad' : '') + '" data-act="pPick" data-id="' + id + '" data-kind="' + c.kind + '" data-pair="' + c.i + '" aria-pressed="' + (P.sel === id) + '"' +
        (matched ? ' disabled' : '') + '>' + (c.kind === 'h' ? bigGlyphs(it.h) : '<span>' + esc(it.m) + '</span>') + '</button>';
    }).join('') + '</div>' +
    (P.done ? '<p class="score" id="pDone">' + esc(t('pDone')) + '</p>' + (P.record ? '<p>' + esc(t('pNewBest')) + '</p>' : '') : '') +
    '<button class="btn' + (P.done ? ' pri' : '') + '" data-act="pAgain">' + esc(t('pAgain')) + '</button></section>';
}
function pairsPick(id) {
  if (!P || P.done) return;
  const c = P.cards[id];
  if (!c || P.matched.has(c.i)) return;
  if (!P.t0) {
    P.t0 = Date.now();
    P.timer = setInterval(() => { P.elapsed = Date.now() - P.t0; const el = $('#pTime'); if (el) el.textContent = t('pTime', { t: fmtTime(P.elapsed) }); }, 100);
  }
  P.bad = [];
  const a = P.sel == null ? null : P.cards[P.sel];
  if (!a) P.sel = id;
  else if (P.sel === id) P.sel = null;

  else {
    P.tries++;

  cAgain() { C.queue.push(C.queue.shift()); C.flipped = false; renderCards(); refocus('#fc'); },
  cKnow() { C.queue.shift(); C.flipped = false; renderCards(); refocus('#fc'); },
  cRestart() { C = null; renderCards(); refocus('#fc'); },
  qPick(b) { quizPick(+b.dataset.k); },
  qNext: quizNext,
  qAgain() { newQuiz(curSet()); renderQuiz(); },
  pPick(b) { pairsPick(+b.dataset.id); },
  pAgain() { newPairs(curSet()); renderPairs(); }
};
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (b && !b.disabled) { if (b.tagName === 'A') ev.preventDefault(); ACT[b.dataset.act](b); return; }
  if (ev.target.tagName === 'DIALOG') ev.target.close(); // клік по затіненню
});
document.addEventListener('submit', (ev) => { if (ev.target.id === 'nameForm') { ev.preventDefault(); submitName(); } });
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'setSel') { S.cur = el.value; save(); renderList(); refocus('#setSel'); }
  else if (el.id === 'splitCk') { S.ui.split = el.checked; save(); }
  else if (el.dataset.ui) { S.ui[el.dataset.ui] = el.checked; uiChanged('#sBody [data-ui="' + el.dataset.ui + '"]'); }
  else if (el.dataset.mode) { S.ui.modes[el.dataset.mode] = el.checked; uiChanged('#sBody [data-mode="' + el.dataset.mode + '"]'); }
  else if (el.dataset.opt === 'rad') { S.opts.rad = el.checked; save(); mountWriter(); }
  else if (el.dataset.opt === 'strict') { S.opts.strict = el.value; save(); if (W && !W.done) { resetItem(); } renderWrite(); refocus('[data-opt="strict"]'); }
});
document.addEventListener('input', (ev) => {
  const f = ev.target.dataset && ev.target.dataset.f;
  if (!f || !E) return;
  const it = curSet().items[E.i];
  if (!it) return;
  const v = ev.target.value.trim();
  if (f === 'n') { if (v) it.n = v; else delete it.n; }
  else { it[f] = v; delete it[f === 'p' ? 'ap' : 'a']; }
  save();
});
$('#dlgEntry').addEventListener('close', () => {
  if (E) E.token++;
  $('#eField').innerHTML = '';
  try { speechSynthesis.cancel(); } catch (e) {}
  const i = E ? E.i : -1;
  E = null;
  if (R === 'list') { renderTiles(); refocus('.tile[data-idx="' + i + '"]'); } else route();
});
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || document.querySelector('dialog[open]')) return;
  const tag = ev.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (R === 'quiz' && Q) {
    if (/^[1-4]$/.test(ev.key)) { ev.preventDefault(); quizPick(+ev.key - 1); }
    else if (ev.key === 'Enter' && Q.ans != null && tag !== 'BUTTON') { ev.preventDefault(); quizNext(); }
  } else if (R === 'write' && W && ev.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') { ev.preventDefault(); writeNext(); }
});
window.addEventListener('hashchange', route);
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { const el = $('#field'); if (R === 'write' && W && el && Math.round(el.clientWidth) !== W.size) mountWriter(); }, 200);
});
if (mqDark) { const onScheme = () => { if (S.ui.theme === 'auto') { applyUI(); route(); } }; if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else if (mqDark.addListener) mqDark.addListener(onScheme); }
if ('speechSynthesis' in window) {
  findVoice();
  try { speechSynthesis.addEventListener('voiceschanged', findVoice); } catch (e) {}
}

window.__zoshyt = { T, DB, STRICT, parseInput, state: () => S, write: () => W };
applyUI();
route();
</script>
